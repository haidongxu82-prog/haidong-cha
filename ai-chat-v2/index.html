<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>海东 AI 对话 V2</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <aside class="rail" aria-label="主导航">
    <a class="brand-link" href="https://ai.haidong.chat/" aria-label="回到 AI 对话首页">
      <svg class="brand" aria-hidden="true" width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="18" y="18" width="476" height="476" rx="120" fill="#F8F9FB"/>
        <rect x="18.5" y="18.5" width="475" height="475" rx="119.5" stroke="#202124" stroke-opacity="0.07"/>
        <path d="M146 164V348M146 256H258M258 164V348M258 164H318C382 164 418 203 418 256C418 309 382 348 318 348H258" stroke="url(#hd-gradient)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M130 388H382" stroke="#202124" stroke-opacity="0.055" stroke-width="14" stroke-linecap="round"/>
        <circle cx="390" cy="132" r="10" fill="#202124" fill-opacity="0.1"/>
        <defs>
          <linearGradient id="hd-gradient" x1="130" y1="172" x2="421" y2="342" gradientUnits="userSpaceOnUse">
            <stop stop-color="#245FA8"/>
            <stop offset="1" stop-color="#6C4AB6"/>
          </linearGradient>
        </defs>
      </svg>
    </a>
    <button class="rail-btn history" type="button" aria-label="历史" aria-expanded="false"></button>
    <button class="rail-btn theme" type="button" aria-label="切换主题"></button>
  </aside>

  <aside class="history-drawer" aria-label="历史记录">
    <div class="drawer-head">
      <span>历史记录</span>
      <button class="drawer-close" type="button" aria-label="关闭历史"></button>
    </div>
    <button class="history-item active" type="button">
      <span>自动化工作流整理</span>
      <small>今天</small>
    </button>
    <button class="history-item" type="button">
      <span>公众号文章开头</span>
      <small>昨天</small>
    </button>
    <button class="history-item" type="button">
      <span>图片生成提示词</span>
      <small>周三</small>
    </button>
  </aside>

  <main class="shell">
    <header class="topbar">
      <div>
        <h1>今天想把哪件事交给 AI？</h1>
      </div>
      <button class="new-chat" type="button" aria-label="新对话">+</button>
    </header>

    <section class="workspace">
      <section class="model-wall" aria-label="模型墙">
        <div class="mode-tabs">
          <button class="mode active" data-group="chat" type="button">对话</button>
          <button class="mode" data-group="image" type="button">生图</button>
        </div>
        <div class="models">
          <button class="model active" data-group="chat" type="button">🔥 GPT-5.4 Pro</button>
          <button class="model" data-group="chat" type="button">🟢 GPT-5.4</button>
          <button class="model" data-group="chat" type="button">🟢 GPT-5.4 Mini</button>
          <button class="model" data-group="chat" type="button">🟠 Claude Opus 4.7</button>
          <button class="model" data-group="chat" type="button">🟠 Claude Sonnet 4.6</button>
          <button class="model" data-group="chat" type="button">🟡 Claude Haiku 4.5</button>
          <button class="model" data-group="chat" type="button">🔵 Gemini 3.5 Flash</button>
          <button class="model" data-group="chat" type="button">🔵 Gemini 3.1 Pro</button>
          <button class="model" data-group="chat" type="button">🔵 Gemini 2.5 Pro</button>
          <button class="model" data-group="chat" type="button">🔵 Gemini 2.5 Flash</button>
          <button class="model" data-group="chat" type="button">🤖 Grok 4</button>
          <button class="model" data-group="chat" type="button">🟢 GPT-4o</button>
          <button class="model" data-group="chat" type="button">🧠 o4-mini</button>
          <button class="model" data-group="chat" type="button">🧠 o3-mini</button>
          <button class="model" data-group="chat" type="button">🌊 DeepSeek V3</button>
          <button class="model" data-group="chat" type="button">🟣 Qwen3 235B</button>
          <button class="model is-hidden" data-group="image" type="button">🖼️ GPT-Image-2</button>
          <button class="model is-hidden" data-group="image" type="button">🎨 GPT-Image-1</button>
          <button class="model is-hidden" data-group="image" type="button">📸 Gemini 3.1 Image</button>
          <button class="model is-hidden" data-group="image" type="button">✨ Gemini 2.5 Image</button>
        </div>
      </section>

      <section class="conversation" aria-label="对话">
      </section>

      <form class="composer">
        <textarea rows="1" placeholder="输入想法、任务或问题..."></textarea>
        <button type="button" aria-label="发送">➤</button>
      </form>
    </section>
  </main>

    <div class="auth-gate" role="dialog" aria-modal="true" aria-label="访问验证">
    <section class="auth-card">
      <div class="auth-logo">HD</div>
      <h2>访问验证</h2>
      <p>这个 AI 集成站会消耗模型额度。请输入访问密码后再使用。</p>
      <form class="auth-form">
        <input id="accessPassword" type="password" autocomplete="current-password" placeholder="输入访问密码">
        <button id="authSubmit" type="submit">进入海东 AI</button>
        <div class="auth-error" id="authError"></div>
      </form>
      <div class="auth-note">没有密码的人可以打开页面，但无法调用任何模型。</div>
    </section>
  </div>

  <script src="./app.js"></script>
</body>
</html>
