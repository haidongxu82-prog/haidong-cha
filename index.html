    <script>
      (() => {
        const announcements = document.querySelectorAll(".announcement[data-expire-at]");
        const shell = document.querySelector(".shell");
        if (!announcements.length || !shell) return;

        announcements.forEach((announcement) => {
          const expireAt = new Date(announcement.dataset.expireAt);
          if (Number.isNaN(expireAt.getTime()) || new Date() < expireAt) return;

          announcement.classList.add("announcement-expired");
          shell.appendChild(announcement);
        });
      })();

    </script>
