<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文章 - 海东的 AI 工作台</title>
    <meta name="description" content="海东关于 AI、自动化、杭州生活和工具实践的文章列表。" />
    <meta property="og:title" content="文章 - 海东的 AI 工作台" />
    <meta property="og:description" content="从杭州出发，记录 AI 工具、自动化和生活里的观察。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://haidong.chat/posts/" />
    <meta property="og:image" content="https://haidong.chat/assets/hero-hangzhou.png" />
    <link rel="icon" type="image/svg+xml" href="../assets/logo-hd-minimal.svg" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="inner-page">
    <header class="site-header inner-header">
      <a class="brand" href="../index.html" aria-label="回到首页">
        <span class="brand-mark" aria-hidden="true">
          <img src="../assets/logo-hd-minimal.svg" alt="" />
        </span>
        <span>haidong.chat</span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="../index.html#tools">工具</a>
        <a href="../index.html#writing">文章</a>
        <a href="../index.html#moments">照片</a>
        <a href="../index.html#about">关于</a>
      </nav>
    </header>

    <main class="article-shell">
      <section class="archive-page">
        <p class="section-kicker">Writing archive</p>
        <h1>文章</h1>
        <div class="archive-list" data-archive-posts>
          <a class="archive-row" href="2026-05-28.html">
            <time datetime="2026-05-28">2026.05.28</time>
            <span>用洗碗的逻辑，想自动化的事</span>
          </a>
        </div>
        <a class="back-link" href="../index.html">返回首页</a>
      </section>
    </main>
    <script>
      fetch("posts.json")
        .then((response) => response.ok ? response.json() : [])
        .then((posts) => {
          const list = document.querySelector("[data-archive-posts]");
          if (!list || !Array.isArray(posts) || posts.length === 0) return;
          list.innerHTML = posts
            .slice()
            .sort((a, b) => b.date.localeCompare(a.date))
            .map((post) => `
              <a class="archive-row" href="${post.file}">
                <time datetime="${post.date}">${post.displayDate}</time>
                <span>${post.title}</span>
              </a>
            `)
            .join("");
        })
        .catch(() => {});
    </script>
  </body>
</html>
